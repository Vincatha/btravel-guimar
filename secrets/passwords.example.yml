# PLANTILLA — cópiala a secrets/passwords.yml y pon ahí las contraseñas reales.
# secrets/passwords.yml está en .gitignore: NUNCA se sube al repositorio.
#
# En producción (Netlify) es preferible usar variables de entorno:
#   ITINERARIO_PW_JAPON, ITINERARIO_PW_LONDRES, ...
#
# Una contraseña por viaje (independiente). Se recomienda una frase de 4-5
# palabras. Mientras el valor contenga "PENDIENTE", el itinerario privado de
# ese viaje NO se genera.

japon: "⟨PENDIENTE⟩"
londres: "⟨PENDIENTE⟩"
vietnam: "⟨PENDIENTE⟩"
escocia: "⟨PENDIENTE⟩"
sri-lanka-turquia: "⟨PENDIENTE⟩"
