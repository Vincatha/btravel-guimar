  itinerario_resumen:
    confirmado: true
    bloques:
      - dias: Día 1
        titulo: Vuelo a Oviedo y Cudillero
        texto: >-
          Recogida del grupo en Güímar y traslado a Tenerife Norte. Vuelo directo a Oviedo y almuerzo en
          restaurante. Por la tarde, visita de Cudillero, pueblo pesquero encajado en la ladera, con su
          iglesia de San Pablo y el faro de la punta. Traslado al hotel en Oviedo.
      - dias: Día 2
        titulo: Oviedo
        texto: >-
          Visita de Oviedo con guía local: una panorámica por el Palacio de Congresos, el Campo de San
          Francisco y el Teatro Campoamor, donde se entregan los Premios Princesa de Asturias. Exteriores de
          la catedral, la plaza de Trascorrales, la plaza del Ayuntamiento y el Mercado. Almuerzo en
          restaurante y tarde libre.
      - dias: Día 3
        titulo: Covadonga, los Lagos y Cangas de Onís
        texto: >-
          Visita del santuario de Covadonga y de Cangas de Onís. Posibilidad de subir a los Lagos, no incluida
          y sujeta a las condiciones meteorológicas.
      - dias: Día 4
        titulo: Gijón
        texto: >-
          Gijón y la Universidad Laboral con guía local. El cerro de Santa Catalina con el «Elogio del
          Horizonte» de Eduardo Chillida, el barrio de Cimadevilla y las playas de San Lorenzo y de Poniente.
          Almuerzo en restaurante y tiempo libre.
      - dias: Día 5
        titulo: Ribadeo, Playa de las Catedrales y Mondoñedo
        texto: >-
          Salida hacia Ribadeo, con sus dársenas de Porcillán y Cabanela y los restos de su muralla. Visita de
          la Playa de las Catedrales, según el estado de la marea. Almuerzo en restaurante y, por la tarde,
          Mondoñedo, una de las siete capitales del antiguo Reino de Galicia: el exterior de su catedral y la
          Plaza de España, con la escultura de Álvaro Cunqueiro.
      - dias: Día 6
        titulo: Regreso a Tenerife
        texto: >-
          Desayuno y tiempo libre en Oviedo. A la hora indicada, recogida en el hotel y traslado al aeropuerto
          para el vuelo directo de Oviedo a Tenerife Norte. Llegada y traslado a Güímar.
