  itinerario_resumen:
    confirmado: true
    bloques:
      - dias: 13 abril
        titulo: De Tenerife a Bruselas
        texto: Vuelo desde Tenerife Norte con escala en Madrid. Llegada, traslado al hotel y cena.
      - dias: 14 abril
        titulo: El corazón de Bruselas
        texto: Visita guiada a pie por el centro histórico, con la Grand Place, las Galerías Saint Hubert y el Manneken Pis. Almuerzo y tarde libres.
      - dias: 15 abril
        titulo: Brujas y Gante
        texto: Recorrido a pie por la Brujas medieval y sus canales. Almuerzo en restaurante y visita de Gante antes de regresar a Bruselas.
      - dias: 16 abril
        titulo: Amberes y Lovaina
        texto: Visita del centro histórico de Amberes y almuerzo en restaurante. Por la tarde, descubrimos la ciudad universitaria de Lovaina.
      - dias: 17 abril
        titulo: Rotterdam y La Haya
        texto: Visita de Rotterdam, sus monumentos, sus puentes y el mercado Markthal. Almuerzo y traslado a La Haya, donde nos alojaremos.
      - dias: 18 abril
        titulo: Keukenhof y Ámsterdam
        texto: Visita de los jardines de tulipanes de Keukenhof. Almuerzo y recorrido guiado por Ámsterdam, con la Plaza Dam y su entorno monumental.
      - dias: 19 abril
        titulo: Zaanse Schans y Volendam
        texto: Un día entre casas tradicionales, molinos y paisajes rurales. Almuerzo en restaurante y visita del pueblo pesquero de Volendam.
      - dias: 20 abril
        titulo: Regreso a Tenerife
        texto: Desayuno y traslado al aeropuerto de Ámsterdam. Vuelo de regreso a Tenerife Norte con escala en Madrid.
