  itinerario_resumen:
    confirmado: true
    bloques:
      - dias: Día 1
        titulo: Vuelo a la Capadocia
        texto: >-
          Encuentro en el aeropuerto con el acompañante de B Travel Güímar. Vuelo Tenerife Norte – Madrid y
          vuelo Madrid – Kayseri con escala en Estambul. Traslado al hotel en la Capadocia. Cena y
          alojamiento.
      - dias: Día 2
        titulo: "Capadocia: valles y chimeneas de hadas"
        texto: >-
          El valle de Göreme y sus iglesias rupestres de los siglos X y XI, el pueblo troglodita de Uçhisar,
          el valle de Derbent y los Üçgüzeller de Ürgüp. Almuerzo en restaurante y visita a talleres
          artesanales.
      - dias: Día 3
        titulo: Capadocia y Konya
        texto: >-
          La ciudad subterránea de Özkonak y salida hacia Konya con almuerzo en ruta. Visita de un
          caravanserai selyúcida y del Museo de Mevlana. Cena y alojamiento en Konya. Al amanecer, opción de
          volar en globo sobre la Capadocia.
      - dias: Día 4
        titulo: Pamukkale
        texto: >-
          El "Castillo de Algodón", con sus piscinas naturales de aguas termales y cascadas petrificadas de
          travertino, y las ruinas de la antigua Hierápolis.
      - dias: Día 5
        titulo: Éfeso y Kuşadası
        texto: >-
          El área arqueológica de Éfeso: el Odeón, el Templo de Adriano, la Biblioteca de Celso, el Ágora, la
          calle de Mármol y el gran Teatro. La Casa de la Virgen María y un centro de producción de cuero.
          Noche en Kuşadası.
      - dias: Día 6
        titulo: Bursa y Estambul
        texto: >-
          Bursa, primera capital del Imperio Otomano: la Mezquita Verde (Yeşil Camii), el Mercado de la Seda y
          el Mausoleo Verde. Continuación hacia Estambul.
      - dias: Día 7
        titulo: Bósforo y Sultanahmet
        texto: >-
          El Bazar Egipcio o Mercado de las Especias, un crucero por el Bósforo y el barrio de Sultanahmet: el
          Hipódromo, la Mezquita Azul y la basílica de Santa Sofía.
      - dias: Día 8
        titulo: Palacios, barrios y bazares
        texto: >-
          El Palacio de Topkapi, el distrito de Pera y Gálata, la plaza Taksim y la avenida İstiklal, la
          Mezquita de Süleymaniye y tiempo libre en el Gran Bazar.
      - dias: Día 9
        titulo: Regreso a Tenerife
        texto: >-
          Traslado al aeropuerto de Estambul y vuelo a Madrid; recogida de equipaje y vuelo directo de Madrid
          a Tenerife Norte.
