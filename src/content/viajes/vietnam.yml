    bloques:
      - dias: 18–20 marzo
        titulo: Ho Chi Minh y el Mekong
        texto: >-
          Viaje a Ho Chi Minh y recorrido por el delta del Mekong, con canales, aldeas y paseos en tuk tuk y
          barca. Cena en crucero por el río Saigón.
      - dias: 21–23 marzo
        titulo: Hoi An y Hue
        texto: >-
          Visita de Ho Chi Minh y vuelo a Da Nang. Ba Na Hills y Puente Dorado, casco antiguo de Hoi An y ruta
          a Hue con cena imperial.
      - dias: 24–25 marzo
        titulo: Hue y Hanói
        texto: >-
          Río de los Perfumes, pagoda Thien Mu y Ciudadela Imperial antes de volar a Hanói. Visita de la
          capital y recorrido en xích lô por el Barrio Antiguo.
      - dias: 26–28 marzo
        titulo: Ha Long y Ninh Binh
        texto: >-
          Crucero con noche a bordo en Ha Long. Continuación a Ninh Binh para conocer Hoa Lu, navegar en barca
          por Tam Coc y visitar Bich Dong.
      - dias: 29–30 marzo
        titulo: Regreso a Tenerife
        texto: Tiempo libre en Hanói y vuelos de regreso vía Estambul y Madrid.
