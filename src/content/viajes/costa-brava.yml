  itinerario_resumen:
    confirmado: true
    bloques:
      - dias: Día 1
        titulo: Vuelo a Barcelona
        texto: >-
          Salida desde Tenerife Norte en vuelo directo a Barcelona y traslado al hotel en Roses. Cena y
          alojamiento.
      - dias: Día 2
        titulo: Begur, Pals y tren turístico
        texto: >-
          Visita de Begur, uno de los pueblos más emblemáticos de la Costa Brava, y de Pals, con su núcleo
          antiguo de El Pedró y restos de muralla. Por la tarde, paseo en tren turístico por la costa.
      - dias: Día 3
        titulo: Banyoles, Besalú y Figueres
        texto: >-
          El lago de Banyoles y la comarca de la Garrotxa, la villa medieval de Besalú con su judería y, por
          la tarde, Figueres y el Teatro-Museo Dalí. Almuerzo en restaurante.
      - dias: Día 4
        titulo: Girona
        texto: >-
          Ciudad histórica con uno de los barrios judíos mejor conservados de Europa, la catedral gótica de
          nave única y el claustro románico. Tarde libre para playa o piscina en Roses.
      - dias: Día 5
        titulo: Barcelona
        texto: >-
          Día completo en la capital catalana: visita panorámica por el Paseo de Gracia, la Plaza de España,
          Montjuïc y el anillo olímpico, la Sagrada Familia, el barrio gótico y las Ramblas con el mercado de
          La Boquería. Almuerzo y tarde libres.
      - dias: Día 6
        titulo: Cadaqués en barco
        texto: >-
          Salida en barco hasta Cadaqués para recorrer su litoral rocoso y sus calas, y tiempo en su casco
          histórico de sabor marinero. Tarde libre en Roses.
      - dias: Día 7
        titulo: Vuelta a Tenerife
        texto: >-
          Mañana libre en Roses y traslado al aeropuerto de Barcelona para el vuelo directo a Tenerife Norte.
          Traslado a Güímar.
