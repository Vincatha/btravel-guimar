  confirmado: false
  titulo: "Quién viaja contigo"
  intro_fija: >
    En B Travel Güímar te atienden siempre las mismas personas, y son ellas
    quienes suelen viajar con los grupos.
  personas:
    - foto:
        archivo: "home/equipo/propietarios.jpg"
        alt: "Propietarios de B Travel Güímar"
        placeholder: "⟨FOTO PROPIETARIOS — PENDIENTE⟩"
      nombre: "⟨NOMBRE — PENDIENTE⟩"
      funcion: "⟨FUNCIÓN — PENDIENTE⟩"
      descripcion: "⟨DESCRIPCIÓN — PENDIENTE⟩"
  sobre_acompanamiento: "⟨TEXTO SOBRE EL ACOMPAÑAMIENTO DURANTE EL VIAJE — PENDIENTE⟩"
