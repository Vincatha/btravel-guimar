# Preguntas frecuentes de la home.
# Respuestas redactadas solo con información general y confirmada (prompt §2).
# Nada de precios, fechas ni condiciones concretas: para eso, "Consúltanos".

- pregunta: "¿Desde dónde salen los viajes?"
  respuesta: >
    Todos nuestros viajes de grupo salen desde Tenerife. Nosotros nos encargamos
    de la conexión con la Península: tú no tienes que montar nada. Te decimos si
    la salida es por Tenerife Norte o Tenerife Sur en cada viaje.

- pregunta: "¿Va alguien de la agencia en el viaje?"
  respuesta: >
    Sí. En todos los viajes de grupo va un acompañante de B Travel Güímar desde
    la salida hasta la vuelta. Está para resolver, no para hacer de guía: el guía
    local lo pone cada destino.

- pregunta: "¿Se puede pagar a plazos?"
  respuesta: >
    Sí. El pago se puede fraccionar en mensualidades hasta la fecha del viaje.
    El plan concreto de cada salida te lo damos en la oficina o por WhatsApp.

- pregunta: "¿De cuánta gente son los grupos?"
  respuesta: >
    Son grupos reducidos, con gente de la comarca. El número exacto depende de
    cada viaje: pregúntanos por la salida que te interese.

- pregunta: "¿Tenéis oficina física?"
  respuesta: >
    Sí, en la Avda. Santa Cruz, 6, en Güímar. Puedes pasarte a preguntar sin
    compromiso. El horario te lo confirmamos por teléfono o WhatsApp.

- pregunta: "¿Cómo reservo una plaza?"
  respuesta: >
    Escríbenos por WhatsApp o pásate por la oficina. Te contamos el viaje con
    detalle, resolvemos tus dudas y, si te decides, te guardamos la plaza.

- pregunta: "¿El seguro de viaje está incluido?"
  respuesta: >
    Depende del viaje. Algunos llevan un seguro básico incluido y en todos se
    puede añadir un seguro ampliado de viaje y cancelación. Te lo detallamos al
    consultar la salida.

- pregunta: "¿Puedo ir en habitación individual?"
  respuesta: >
    Sí, con un suplemento por habitación individual que varía según el viaje.
    Consúltanos el importe de la salida que te interese.
